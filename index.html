
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Personal Expense Tracker</h1>
        <p class="subtitle">Manage your daily expenses easily.</p>

        <div class="summary">
            <div class="summary-card">
                <h3>Total Expenses</h3>
                <p id="total-count">0</p>
            </div>
            <div class="summary-card">
                <h3>Total Amount Spent</h3>
                <p id="total-amount">Rs. 0.00</p>
            </div>
        </div>

        <section class="form-section">
            <h2>Add New Expense</h2>
            <form id="expense-form">
                <label for="title">Expense Title</label>
                <input type="text" id="title" required placeholder="e.g. Groceries">

                <label for="amount">Amount (Rs.)</label>
                <input type="number" id="amount" min="0.01" step="0.01"
                       required placeholder="Enter amount">

                <label for="category">Category</label>
                <select id="category" required>
                    <option value="">Select category</option>
                    <option value="Food">Food</option>
                    <option value="Travel">Travel</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Bills">Bills</option>
                    <option value="Other">Other</option>
                </select>

                <label for="date">Date</label>
                <input type="date" id="date" required>

                <button type="submit">Add Expense</button>
            </form>
        </section>

        <section class="table-section">
            <h2>Expense History</h2>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Amount</th>
                            <th>Category</th>
                            <th>Date</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="expense-list"></tbody>
                </table>
            </div>
            <p id="empty-message">No expenses added yet.</p>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
